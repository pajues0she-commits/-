<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>멍멍 건강수첩 · 견종별 강아지 건강관리</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
</head>
<body>
  <div class="app">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">🐶</span>
        <div>
          <h1 class="brand-title">멍멍 건강수첩</h1>
          <p class="brand-sub">견종별 건강관리</p>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="addDogBtn">＋ 강아지 추가</button>

      <div class="sidebar-section">
        <h2 class="sidebar-label">우리 아이들</h2>
        <div id="dogList" class="dog-list"></div>
      </div>

      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm" id="exportBtn">⬇ 백업</button>
        <button class="btn btn-ghost btn-sm" id="importBtn">⬆ 복원</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </aside>

    <!-- 메인 -->
    <main id="dashboard" class="dashboard"></main>
  </div>

  <!-- 모달 컨테이너 -->
  <div id="modal" class="modal"></div>

  <script src="js/breeds.js"></script>
  <script src="js/health.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
