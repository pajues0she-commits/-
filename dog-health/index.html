<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="멍멍 건강수첩">
  <title>멍멍 건강수첩</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
</head>
<body>
  <div class="phone">
    <!-- 상단 앱바 -->
    <header class="appbar" id="appbar">
      <div class="appbar-title">
        <span class="appbar-logo">🐶</span>
        <span id="appbarTitle">멍멍 건강수첩</span>
      </div>
      <button class="appbar-btn" id="appbarAction" hidden></button>
    </header>

    <!-- 화면 영역 -->
    <main class="screen" id="screen"></main>

    <!-- 플로팅 액션 버튼 -->
    <button class="fab" id="fab" hidden>＋</button>

    <!-- 하단 탭 내비게이션 -->
    <nav class="tabbar" id="tabbar">
      <button class="tabbar-item active" data-screen="home">
        <span class="tabbar-icon">🏠</span><span class="tabbar-label">홈</span>
      </button>
      <button class="tabbar-item" data-screen="trends">
        <span class="tabbar-icon">📈</span><span class="tabbar-label">트렌드</span>
      </button>
      <button class="tabbar-item" data-screen="records">
        <span class="tabbar-icon">📋</span><span class="tabbar-label">기록</span>
      </button>
      <button class="tabbar-item" data-screen="more">
        <span class="tabbar-icon">⚙️</span><span class="tabbar-label">더보기</span>
      </button>
    </nav>
  </div>

  <!-- 바텀시트 모달 -->
  <div id="sheet" class="sheet-backdrop">
    <div class="sheet" id="sheetBox"></div>
  </div>

  <!-- 토스트 -->
  <div id="toast" class="toast"></div>

  <script src="js/breeds.js"></script>
  <script src="js/health.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
