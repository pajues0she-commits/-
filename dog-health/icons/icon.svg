<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b82ff"/>
      <stop offset="1" stop-color="#9a6bf5"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9db0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff9db0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 (모서리까지 꽉 채운 불투명 정사각 — iOS/Android가 알아서 둥글게 처리) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 귀 (안전 영역 안에 배치) -->
  <ellipse cx="156" cy="214" rx="48" ry="86" fill="#a86232" transform="rotate(-16 156 214)"/>
  <ellipse cx="356" cy="214" rx="48" ry="86" fill="#a86232" transform="rotate(16 356 214)"/>
  <ellipse cx="159" cy="208" rx="28" ry="58" fill="#c88a54" transform="rotate(-16 159 208)"/>
  <ellipse cx="353" cy="208" rx="28" ry="58" fill="#c88a54" transform="rotate(16 353 208)"/>

  <!-- 얼굴 -->
  <circle cx="256" cy="250" r="142" fill="#fff4e2"/>

  <!-- 왼쪽 눈 주위 갈색 점무늬 (귀여운 포인트) -->
  <ellipse cx="208" cy="236" rx="58" ry="62" fill="#c88a54" opacity="0.5"/>

  <!-- 주둥이 -->
  <ellipse cx="256" cy="318" rx="92" ry="74" fill="#fffbf4"/>

  <!-- 볼터치 -->
  <circle cx="176" cy="306" r="27" fill="url(#cheek)"/>
  <circle cx="336" cy="306" r="27" fill="url(#cheek)"/>

  <!-- 눈 -->
  <circle cx="210" cy="244" r="25" fill="#3f2f26"/>
  <circle cx="302" cy="244" r="25" fill="#3f2f26"/>
  <circle cx="219" cy="236" r="8" fill="#ffffff"/>
  <circle cx="311" cy="236" r="8" fill="#ffffff"/>

  <!-- 코 -->
  <ellipse cx="256" cy="298" rx="25" ry="19" fill="#3f2f26"/>
  <ellipse cx="249" cy="292" rx="7" ry="4" fill="#ffffff" opacity="0.55"/>

  <!-- 입 -->
  <path d="M256 317 Q256 343 233 345 M256 317 Q256 343 279 345" fill="none" stroke="#3f2f26" stroke-width="8" stroke-linecap="round"/>

  <!-- 혀 -->
  <path d="M244 344 Q256 373 268 344 Q268 338 256 338 Q244 338 244 344 Z" fill="#ff8fa3"/>
</svg>
